<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Cartão Digital</title>
  <!-- FontAwesome para os ícones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* Estilos gerais */
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    h1 {
      margin-bottom: 5px;
      color: #333;
    }

    p.subtitle {
      color: #666;
      margin-bottom: 25px;
    }

    .links-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .link-card {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background-color: #0070f3;
      color: white;
      text-decoration: none;
      padding: 14px 20px;
      border-radius: 10px;
      font-weight: bold;
      transition: background-color 0.2s ease;
      cursor: pointer;
    }

    .link-card:hover {
      background-color: #0051a2;
    }

    .link-card.whatsapp { background-color: #25D366; }
    .link-card.instagram { background-color: #E1306C; }
    .link-card.youtube { background-color: #FF0000; }
    .link-card.tiktok { background-color: #000000; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Seu Nome Aqui</h1>
    <p class="subtitle">Bem-vindo ao meu cartão digital!</p>

    <div class="links-container">
      <!-- Botão Me Adicione com clique tratado via JS -->
      <a href="#" onclick="adicionarContato(event)" class="link-card">
        <i class="fa-solid fa-address-book"></i> Me Adicione
      </a>

      <!-- Redes Sociais -->
      <a href="https://wa.me/5521999999999" target="_blank" class="link-card whatsapp">
        <i class="fa-brands fa-whatsapp"></i> WhatsApp
      </a>

      <a href="https://instagram.com/seu_usuario" target="_blank" class="link-card instagram">
        <i class="fa-brands fa-instagram"></i> Instagram
      </a>

      <a href="https://youtube.com/@seu_canal" target="_blank" class="link-card youtube">
        <i class="fa-brands fa-youtube"></i> YouTube
      </a>

      <a href="https://tiktok.com/@seu_usuario" target="_blank" class="link-card tiktok">
        <i class="fa-brands fa-tiktok"></i> TikTok
      </a>
    </div>
  </div>

  <script>
    function adicionarContato(event) {
      event.preventDefault();

      // ==========================================
      // 🔴 PREENCHA COM SEUS DADOS REAIS ABAIXO:
      // ==========================================
      const dados = {
        nome: "Seu Nome Completo",
        telefone: "+5521999999999",
        email: "seuemail@exemplo.com",
        empresa: "", 
        vcfUrl: "contato.vcf"
      };

      const userAgent = navigator.userAgent || navigator.vendor || window.opera;
      const isAndroid = /android/i.test(userAgent);

      if (isAndroid) {
        // No Android: Abre a agenda nativa direta com os dados preenchidos
        const intentUrl = `intent:#Intent;action=android.intent.action.INSERT;` +
                          `type=vnd.android.cursor.dir/contact;` +
                          `S.name=${encodeURIComponent(dados.nome)};` +
                          `S.phone=${encodeURIComponent(dados.telefone)};` +
                          `S.email=${encodeURIComponent(dados.email)};` +
                          `S.company=${encodeURIComponent(dados.empresa)};` +
                          `end`;
        
        window.location.href = intentUrl;
      } else {
        // No iPhone (iOS): Redireciona para o arquivo .vcf
        window.location.href = dados.vcfUrl;
      }
    }
  </script>

</body>
</html>
