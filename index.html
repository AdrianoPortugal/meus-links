<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adriano Portugal | Links</title>
  <!-- Ícones do FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #000000;       /* Preto puro */
      --card-bg: #141414;     /* Cinza bem escuro */
      --card-hover: #222222;  /* Leve destaque ao passar o mouse */
      --text-color: #ffffff;    /* Texto e ícones brancos */
      --subtext-color: #a1a1aa; /* Cinza claro para a bio */
      --border-color: #27272a;  /* Borda sutil */
    }

    /* Reset e Configurações Básicas */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0d1117; /* Fundo escuro tecnológico elegante */
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* --- CAMADA DO CIRCUITO ANIMADO --- */
    .circuit-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      opacity: 0.35; /* Suavidade para não poluir visualmente */
    }

    /* Linhas do Circuito */
    .circuit-line {
      stroke: #30363d;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
    }

    /* Nós / Conexões do Circuito */
    .circuit-node {
      fill: #30363d;
    }

    /* Pulso Elétrico Animado */
    .pulse {
      fill: none;
      stroke: #58a6ff; /* Azul elétrico sutil */
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-dasharray: 40 300;
      animation: electric-flow 6s linear infinite;
    }

    .pulse-2 {
      stroke: #3fb950; /* Pulso verde sutil */
      animation: electric-flow 8s linear infinite 2s;
    }

    @keyframes electric-flow {
      0% {
        stroke-dashoffset: 340;
      }
      100% {
        stroke-dashoffset: -340;
      }
    }

    .container {
    /* --- CONTEÚDO DO CARTÃO --- */
    .card-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 380px;
      max-width: 400px;
      background: rgba(22, 27, 34, 0.75); /* Vidro fosco (Glassmorphism) */
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .profile-img {
      width: 110px;
      height: 110px;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      margin-bottom: 16px;
      object-fit: cover;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 20px rgba(255, 255, 255, 0.05);
      border: 2px solid #58a6ff;
      margin-bottom: 16px;
      box-shadow: 0 0 15px rgba(88, 166, 255, 0.2);
    }

    h1 {
      font-size: 1.35rem;
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: -0.01em;
      margin-bottom: 4px;
      color: #f0f6fc;
    }

    p {
      font-size: 0.9rem;
      color: var(--subtext-color);
      margin-bottom: 28px;
    p.subtitle {
      font-size: 0.95rem;
      color: #8b949e;
      margin-bottom: 24px;
      letter-spacing: 0.5px;
    }

    /* Estilização dos Botões */
    .links-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      gap: 14px;
    }

    .link-card {
      background-color: var(--card-bg);
      color: var(--text-color);
      text-decoration: none;
      padding: 16px 20px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.2s ease-in-out;
      border: 1px solid var(--border-color);
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      gap: 10px;
      padding: 14px 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #f0f6fc;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .link-card i {
      font-size: 1.1rem;
      width: 20px;
      text-align: center;
    /* Destaque para o Botão Principal "Me Adicione" */
    .btn-primary {
      background: #238636;
      border-color: #2ea043;
      color: #ffffff;
    }

    .btn-primary:active {
      background: #2ea043;
    }

    .link-card:hover {
      background-color: var(--card-hover);
      border-color: #3f3f46;
      transform: translateY(-1px);
    .btn:active {
      transform: scale(0.98);
      background: rgba(255, 255, 255, 0.12);
    }

    .footer {
      margin-top: 36px;
      margin-top: 28px;
      font-size: 0.75rem;
      color: #52525b;
      color: #484f58;
    }
  </style>
</head>
