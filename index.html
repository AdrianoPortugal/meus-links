<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adriano Portugal | Links</title>
  <style>
    /* Reset e Configurações Básicas */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0d1117; /* Fundo escuro tecnológico elegante */
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* --- CAMADA DO CIRCUITO ANIMADO --- */
    .circuit-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      opacity: 0.35; /* Suavidade para não poluir visualmente */
    }

    /* Linhas do Circuito */
    .circuit-line {
      stroke: #30363d;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
    }

    /* Nós / Conexões do Circuito */
    .circuit-node {
      fill: #30363d;
    }

    /* Pulso Elétrico Animado */
    .pulse {
      fill: none;
      stroke: #58a6ff; /* Azul elétrico sutil */
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-dasharray: 40 300;
      animation: electric-flow 6s linear infinite;
    }

    .pulse-2 {
      stroke: #3fb950; /* Pulso verde sutil */
      animation: electric-flow 8s linear infinite 2s;
    }

    @keyframes electric-flow {
      0% {
        stroke-dashoffset: 340;
      }
      100% {
        stroke-dashoffset: -340;
      }
    }

    /* --- CONTEÚDO DO CARTÃO --- */
    .card-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      background: rgba(22, 27, 34, 0.75); /* Vidro fosco (Glassmorphism) */
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .profile-img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #58a6ff;
      margin-bottom: 16px;
      box-shadow: 0 0 15px rgba(88, 166, 255, 0.2);
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 4px;
      color: #f0f6fc;
    }

    p.subtitle {
      font-size: 0.95rem;
      color: #8b949e;
      margin-bottom: 24px;
      letter-spacing: 0.5px;
    }

    /* Estilização dos Botões */
    .links-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #f0f6fc;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    /* Destaque para o Botão Principal "Me Adicione" */
    .btn-primary {
      background: #238636;
      border-color: #2ea043;
      color: #ffffff;
    }

    .btn-primary:active {
      background: #2ea043;
    }

    .btn:active {
      transform: scale(0.98);
      background: rgba(255, 255, 255, 0.12);
    }

    .footer {
      margin-top: 28px;
      font-size: 0.75rem;
      color: #484f58;
    }
  </style>
</head>
<body>

  <!-- Fundo com Linhas de Circuito e Pulsos Elétricos em SVG -->
  <svg class="circuit-bg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
    <!-- Linhas do Circuito Esquerdo/Superior -->
    <path class="circuit-line" d="M -50 100 L 150 100 L 220 170 L 220 300 L 180 340 L -50 340" />
    <path class="pulse" d="M -50 100 L 150 100 L 220 170 L 220 300 L 180 340 L -50 340" />

    <!-- Linhas do Circuito Direito/Superior -->
    <path class="circuit-line" d="M 850 150 L 650 150 L 580 220 L 580 400 L 620 440 L 850 440" />
    <path class="pulse pulse-2" d="M 850 150 L 650 150 L 580 220 L 580 400 L 620 440 L 850 440" />

    <!-- Linhas do Circuito Inferior Esquerdo -->
    <path class="circuit-line" d="M -50 600 L 200 600 L 280 520 L 280 420" />
    <path class="pulse pulse-2" d="M -50 600 L 200 600 L 280 520 L 280 420" />

    <!-- Linhas do Circuito Inferior Direito -->
    <path class="circuit-line" d="M 850 680 L 600 680 L 520 600 L 520 500" />
    <path class="pulse" d="M 850 680 L 600 680 L 520 600 L 520 500" />

    <!-- Nos/Conexões (Bolinhas do circuito) -->
    <circle class="circuit-node" cx="220" cy="170" r="4" />
    <circle class="circuit-node" cx="180" cy="340" r="4" />
    <circle class="circuit-node" cx="580" cy="220" r="4" />
    <circle class="circuit-node" cx="280" cy="520" r="4" />
    <circle class="circuit-node" cx="520" cy="600" r="4" />
  </svg>

  <!-- Cartão de Visitas Principal -->
  <div class="card-container">
    
    <img src="foto.jpg" alt="Adriano Portugal" class="profile-img">
    
    <h1>Adriano Portugal</h1>
    <p class="subtitle">Informática e CFTV</p>

    <div class="links-container">
      
      <!-- Botão Destaque: Me Adicione (.vcf) -->
      <a href="contato.vcf" download="Adriano_Portugal.vcf" class="btn btn-primary">
        📲 Me Adicione
      </a>

      <!-- WhatsApp com mensagem preenchida -->

        💬 WhatsApp
      </a>

      <!-- Redes Sociais -->
      <a href="https://instagram.com/adrianoporfer" target="_blank" class="btn">
        📷 Instagram
      </a>

      <a href="https://youtube.com/@adrianoportugal" target="_blank" class="btn">
        ▶️ YouTube
      </a>

      <a href="https://tiktok.com/@adrianoportugal1" target="_blank" class="btn">
        🎵 TikTok
      </a>

    </div>

    <div class="footer">
      © 2026 • Adriano Portugal
    </div>

  </div>

</body>
</html>
