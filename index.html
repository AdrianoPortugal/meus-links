<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adriano Portugal | Links</title>
  <!-- Ícones do FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #000000;       /* Preto puro */
      --card-bg: #141414;     /* Cinza bem escuro */
      --card-hover: #222222;  /* Leve destaque ao passar o mouse */
      --text-color: #ffffff;    /* Texto e ícones brancos */
      --subtext-color: #a1a1aa; /* Cinza claro para a bio */
      --border-color: #27272a;  /* Borda sutil */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 380px;
      text-align: center;
    }

    .profile-img {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      margin-bottom: 16px;
      object-fit: cover;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 20px rgba(255, 255, 255, 0.05);
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: -0.01em;
    }

    p {
      font-size: 0.9rem;
      color: var(--subtext-color);
      margin-bottom: 28px;
    }

    .links-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-card {
      background-color: var(--card-bg);
      color: var(--text-color);
      text-decoration: none;
      padding: 16px 20px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.2s ease-in-out;
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .link-card i {
      font-size: 1.1rem;
      width: 20px;
      text-align: center;
    }

    .link-card:hover {
      background-color: var(--card-hover);
      border-color: #3f3f46;
      transform: translateY(-1px);
    }

    .footer {
      margin-top: 36px;
      font-size: 0.75rem;
      color: #52525b;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Sua Foto de Perfil -->
    <img class="profile-img" src="foto.jpg" alt="Adriano Portugal">
    
    <!-- Nome e Bio -->
    <h1>Adriano Portugal</h1>
    <p>Informática e CFTV</p>

    <!-- Links com URLs reais e funcionais -->
    <div class="links-container">
     <a href="#" onclick="adicionarContato(event)" class="link-card">
  <i class="fa-solid fa-address-book"></i> Me Adicione
</a>

      <a href="https://wa.me/5521991642375" class="link-card" target="_blank">
        <i class="fa-brands fa-whatsapp"></i> WhatsApp
      </a>

      <a href="https://instagram.com/adrianoporfer" class="link-card" target="_blank">
        <i class="fa-brands fa-instagram"></i> Instagram
      </a>

      <a href="https://youtube.com/@adrianoportugal" class="link-card" target="_blank">
        <i class="fa-brands fa-youtube"></i> YouTube
      </a>

      <a href="https://tiktok.com/@adrianoportugal1" class="link-card" target="_blank">
        <i class="fa-brands fa-tiktok"></i> TikTok
      </a>
    </div>

    <div class="footer">
      © 2026 • Adriano Portugal
    </div>
  </div>
<script>
function adicionarContato(event) {
  event.preventDefault();

  const dados = {
    nome: "Seu Nome Completo",
    telefone: "+5521999999999",
    email: "seuemail@exemplo.com",
    empresa: "", 
    vcfUrl: "contato.vcf"
  };

  const userAgent = navigator.userAgent || navigator.vendor || window.opera;
  const isAndroid = /android/i.test(userAgent);

  if (isAndroid) {
    const intentUrl = `intent:#Intent;action=android.intent.action.INSERT;` +
                      `type=vnd.android.cursor.dir/contact;` +
                      `S.name=${encodeURIComponent(dados.nome)};` +
                      `S.phone=${encodeURIComponent(dados.telefone)};` +
                      `S.email=${encodeURIComponent(dados.email)};` +
                      `S.company=${encodeURIComponent(dados.empresa)};` +
                      `end`;
    
    window.location.href = intentUrl;
  } else {
    window.location.href = dados.vcfUrl;
  }
}
</script>
  
</body>
</html>
