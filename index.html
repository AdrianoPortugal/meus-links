<!DOCTYPE html>

<head>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0d1117;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* --- CARTÃO COM EFEITO DE AÇO ESCOVADO --- */
    .card-container {
      width: 100%;
      max-width: 400px;
      position: relative;
      border-radius: 20px;
      padding: 35px 25px;
      text-align: center;
      
      /* Base de cor do Aço Escovado */
      background-color: #2b3038;

      /* Reflexo Metálico e textura de Riscos Finos */
      background-image: 
        /* 1. Reflexo Diagonal Metálico */
        linear-gradient(
          135deg, 
          rgba(255,255,255,0.15) 0%, 
          rgba(255,255,255,0.02) 40%, 
          rgba(0,0,0,0.4) 60%, 
          rgba(255,255,255,0.1) 100%
        ),
        /* 2. Textura de Ranhuras do Aço Escovado (SVG incorporado) */
        url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");

      /* Moldura chanfrada de metal usinado */
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 
        0 15px 35px rgba(0, 0, 0, 0.7),
        inset 0 1px 1px rgba(255, 255, 255, 0.4),
        inset 0 -2px 5px rgba(0, 0, 0, 0.5);
    }

    /* Foto de Perfil com Anel de Aço */
    .profile-img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 15px;
      border: 3px solid #1a1d22;
      box-shadow: 
        0 0 0 2px rgba(88, 166, 255, 0.6),
        0 4px 10px rgba(0,0,0,0.5);
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #f0f6fc;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      margin-bottom: 4px;
    }

    p.subtitle {
      font-size: 0.9rem;
      color: #8b949e;
      margin-bottom: 25px;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 600;
    }

    /* --- BOTÕES ELETRÔNICOS ESTILO PAINEL METÁLICO --- */
    .links-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 15px;
      padding: 14px 20px;
      background: linear-gradient(180deg, #21262d 0%, #161b22 100%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #f0f6fc;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      box-shadow: 
        0 4px 6px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      transition: all 0.2s ease;
    }

    /* Botão Principal Destaque (Verde Neon) */
    .btn-primary {
      border-color: #2ea043;
      background: linear-gradient(180deg, #238636 0%, #1e722e 100%);
      box-shadow: 
        0 0 12px rgba(46, 160, 67, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    .btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
    }

    /* Ícones */
    .icon {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: #58a6ff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .btn-primary .icon {
      stroke: #ffffff;
    }

    .footer {
      margin-top: 25px;
      font-size: 0.75rem;
      color: #6e7681;
      letter-spacing: 1px;
    }
  </style>
</head>
