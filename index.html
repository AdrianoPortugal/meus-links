<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adriano Portugal | Links</title>
  <style>
    /* Reset e Fontes */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      /* Fundo de Aço Escovado Geral */
      background: repeating-linear-gradient(
        -45deg,
        #1a1d21,
        #1a1d21 1px,
        #1d2125 1px,
        #1d2125 2px
      );
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* --- ESTILO DO CARTÃO METÁLICO --- */
    .card-container {
      width: 100%;
      max-width: 420px;
      /* Textura de Aço Escovado no Cartão */
      background: linear-gradient(
        135deg, 
        #2c313a 0%, 
        #3e4451 40%, 
        #2c313a 60%, 
        #3e4451 100%
      );
      border: 2px solid rgba(88, 166, 255, 0.4); /* Borda Neon Sutil */
      border-radius: 20px;
      padding: 40px 30px;
      text-align: center;
      /* Efeito de Brilho Neon (Glow) */
      box-shadow: 0 0 20px rgba(88, 166, 255, 0.2), inset 0 0 10px rgba(0,0,0,0.3);
      position: relative;
    }

    .profile-img {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      /* Borda Dupla Metálica/Neon */
      border: 3px solid #1a1d21;
      box-shadow: 0 0 15px rgba(88, 166, 255, 0.5), 0 0 0 3px rgba(88, 166, 255, 0.3);
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: #f0f6fc;
      text-shadow: 0 0 10px rgba(88, 166, 255, 0.4);
    }

    p.subtitle {
      font-size: 1rem;
      color: #8b949e;
      margin-bottom: 35px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* --- CONTAINER DE LINKS (LAYOUT GRID) --- */
    .links-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    /* --- ESTILO DOS BOTÕES ELETRÔNICOS --- */
    .btn {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 16px 20px;
      /* Fundo Escuro com Borda Metálica */
      background: rgba(13, 17, 23, 0.8);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #f0f6fc;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.2s ease-in-out;
      position: relative;
      overflow: hidden;
    }

    /* Destaque para o Botão Principal "Me Adicione" (Glow Verde) */
    .btn-primary {
      border-color: rgba(56, 185, 80, 0.5);
      box-shadow: 0 0 10px rgba(56, 185, 80, 0.1);
    }
    
    .btn-primary:active {
      background: rgba(56, 185, 80, 0.2);
    }

    /* Hover/Active Efeito: Aumenta o Glow Azul */
    .btn:active:not(.btn-primary) {
      transform: translateY(1px);
      background: rgba(88, 166, 255, 0.1);
      border-color: rgba(88, 166, 255, 0.5);
      box-shadow: 0 0 15px rgba(88, 166, 255, 0.3);
    }

    /* --- ÍCONES ESTILO CIRCUITO (SVG) --- */
    .icon {
      width: 24px;
      height: 24px;
      /* Cor do Ícone (Azul Neon) */
      fill: none;
      stroke: #58a6ff; 
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      /* Brilho no Ícone */
      filter: drop-shadow(0 0 5px rgba(88, 166, 255, 0.6));
    }
    
    /* Cor do Ícone no Botão Principal */
    .btn-primary .icon {
      stroke: #3fb950;
      filter: drop-shadow(0 0 5px rgba(63, 185, 80, 0.6));
    }

    .footer {
      margin-top: 40px;
      font-size: 0.8rem;
      color: #484f58;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <!-- Cartão de Visitas Metálico -->
  <div class="card-container">
    
    <img src="foto.jpg" alt="Adriano Portugal" class="profile-img">
    
    <h1>Adriano Portugal</h1>
    <p class="subtitle">Informática e CFTV</p>

    <div class="links-container">
      
      <!-- Botão Me Adicione (Glow Verde) -->
      <a href="contato.vcf" download="Adriano_Portugal.vcf" class="btn btn-primary">
        <!-- Ícone: Smartphone com seta (estilo circuito) -->
        <svg class="icon" viewBox="0 0 24 24"><path d="M17 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2z"></path><polyline points="12 18 12 12 15 15 9 15 12 12"></polyline></svg>
        Me Adicione
      </a>

      <!-- Botão WhatsApp -->
      <a href="https://wa.me/5521991642375?text=Ol%C3%A1%2C%20Adriano!%20Peguei%20seu%20cart%C3%A3o%20e%20gostaria%20de%20conversar." target="_blank" class="btn">
        <!-- Ícone: Chat com sinal (estilo circuito) -->
        <svg class="icon" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
        WhatsApp
      </a>

      <!-- Botão Instagram -->
      <a href="https://instagram.com/adrianoporfer" target="_blank" class="btn">
        <!-- Ícone: Câmera (estilo circuito) -->
        <svg class="icon" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
        Instagram
      </a>

      <!-- Botão YouTube -->
      <a href="https://youtube.com/@adrianoportugal" target="_blank" class="btn">
        <!-- Ícone: Play (estilo circuito) -->
        <svg class="icon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        YouTube
      </a>

      <!-- Botão TikTok -->
      <a href="https://tiktok.com/@adrianoportugal1" target="_blank" class="btn">
        <!-- Ícone: Nota Musical/Onda (estilo circuito) -->
        <svg class="icon" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
        TikTok
      </a>

    </div>

    <div class="footer">
      © 2026 • ADRIANO PORTUGAL
    </div>

  </div>

</body>
</html>
